[project]
name = "meshopt"
version = "0.1.1"
description = "meshoptimizer's encoder and decoder for Python, shaped like its JavaScript module."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "vendor/meshoptimizer/LICENSE.md"]
authors = [{ name = "Aidan Newsome", email = "aidan.newsome@me.com" }]
requires-python = ">=3.12"  # SPEC 0: each Python three years from its release
dependencies = [
    "numpy>=2.0",
]

[project.urls]
Source = "https://github.com/aidannewsome/meshopt"
Releases = "https://github.com/aidannewsome/meshopt/releases"
meshoptimizer = "https://github.com/zeux/meshoptimizer"

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["scikit-build-core>=0.11", "nanobind>=2.9"]
build-backend = "scikit_build_core.build"

[tool.scikit-build]
minimum-version = "build-system.requires"
build-dir = "build/{wheel_tag}"
wheel.packages = ["python/meshopt"]
wheel.py-api = "cp312"  # one wheel a system for every Python from 3.12, through the stable ABI; free-threaded Python gets its own

[tool.ruff]
line-length = 160

[tool.ruff.lint.isort]
known-first-party = ["meshopt"]

[tool.ruff.format]
exclude = ["tests/test_decoder.py"]  # its numbers stay in rows, as the JavaScript test has them
